# ============================================================
# 打法规则配置
# ------------------------------------------------------------
# 全部技能名使用「官方简体中文译名」（PokeAPI zh-Hans 口径）。
# 引擎会先把名字解析成技能 id，再按目标语言输出，
# 所以遇到机翻名 / 英文名的 API 也能正确匹配。
#
# 解析不到的名字（比如 Pokemmo 特有叫法）请放进 data/aliases.json。
# ============================================================

version: 1

# ---------- 白名单 ----------
# 单性别 / 无性别但依然要出打法的精灵
# （出招方案本来只对「同进化链存在异性」的精灵生效，白名单是例外）
whitelist:
  - 艾路雷朵

# ---------- 队伍 ----------
teams:
  default: [沙奈朵, 长耳兔, 图图犬, 呆壳兽]
  anti_prankster: [索罗亚克, 长耳兔, 图图犬, 月亮伊布]

# 触发「恶作剧之心」应对队伍的条件（满足任一）
anti_prankster_trigger:
  pokemon: [利欧路, 勾魂眼, 黑暗鸦, 风妖精]
  abilities: [恶作剧之心]

# 头目带了先制技或回复技时，队伍要插一个中转手
pivot_insert:
  move_groups: [priority, heal]

# ---------- 技能分组 ----------
move_groups:

  # 先制技（会抢先手，威胁我方中转手）
  priority:
    - 音速拳
    - 子弹拳
    - 电光一闪
    - 神速
    - 佯攻
    - 真空波
    - 冰砾
    - 水流喷射
    - 突袭

  # 回复技（拖时间、翻盘，需要回复封锁/挑衅针对）
  heal:
    - 睡觉
    - 月光
    - 羽栖
    - 扎根
    - 吸取拳
    - 水流环
    - 分担痛楚
    - 光合作用
    - 生蛋
    - 终极吸取
    - 自我再生
    - 晨光
    - 祈愿
    - 偷懒
    - 吸取
    - 超级吸取
    - 寄生种子
    - 吸血
    - 木角

  # 干扰/变化技（触发挑衅）
  # 沙奈朵和索罗亚克是同一个位置的两套人选，共用这一份名单
  defense:
    - 电磁波
    - 恶魔之吻
    - 虚张声势
    - 哈欠
    - 诅咒
    - 催眠术
    - 吹飞
    - 再来一次
    - 大蛇瞪眼
    - 掷泥
    - 神秘守护
    - 催眠粉
    - 大闹一番
    - 魔法反射
    - 迷人
    - 替身
    - 草笛
    - 挑衅

  # 强化技（不挑衅就会被滚雪球）
  boost:
    - 龙之舞
    - 诡计
    - 剑舞
    - 高速移动
    - 健美
    - 破壳
    - 冥想
    - 腹鼓
    - 岩石打磨
    - 点穴
    - 蝶舞

  # 冰冻系技能（需要神秘守护）
  freeze:
    - 冰冻拳
    - 冰冻光束
    - 冰冻牙
    - 暴风雪
    - 细雪
    - 三重攻击

  # 麻痹系技能（需要神秘守护）
  paralysis:
    - 十万伏特
    - 雷电拳
    - 泰山压顶
    - 弹跳
    - 放电
    - 电磁炮
    - 打雷
    - 电光
    - 龙息
    - 发劲
    - 舌舔
    - 伏特攻击
    - 雷电牙

# ---------- 特性 ----------
abilities:
  # 遇到这些特性必须带「特性互换」换掉
  require_skill_swap:
    - 迟钝
    - 干劲
    - 奇迹皮肤
    - 魔法镜
    - 早起
    - 不眠
    - 加速

  # 这两个特性下，挑衅要排到第二位（原逻辑：交换前两位）
  taunt_second:
    - 奇迹皮肤
    - 魔法镜

# ---------- 天气组合 ----------
# 头目同时具备「天气技能 + 对应天气特性」时，需要特性互换
weather_rules:
  - move: 大晴天
    abilities: [叶绿素, 叶子防守]
  - move: 求雨
    abilities: [悠游自如, 雨盘, 干燥皮肤]
  - move: 沙暴
    abilities: [沙隐, 拨沙]
  - move: 冰雹
    abilities: [冰冻之躯, 雪隐, 拨雪]

# ---------- 特殊判定 ----------
# 幽灵系需要「识破」才能打到
foresight_required:
  - 勾魂眼
  - 诅咒娃娃
  - 怨影娃娃

# ---------- 非官方技能 ----------
# 这些不在官方技能表里，需要手工指定各语言写法
custom_moves:
  中转:
    zh: 中转
    en: Pivot            # 月亮伊布的接棒 / 呆壳兽的瞬间移动，统一叫中转
  拍手:
    zh: 拍手
    en: Encore           # 即「再来一次」Encore（id 227），民间俗称拍手

# ---------- 输出模板 ----------
templates:
  zh:
    period_unknown: 未知时段
    name_unknown: 未知
    ability_none: 无特性
    location_unknown: 未知地点
    moves_none: 无
    no_gender: 无性别
    gender_suffix: "%公"
    moves_label: "技能: "
    strategy_header: 打法推荐：
    reporter_label: "报点人: "
    name_separator: "："
    list_separator: ", "
  en:
    period_unknown: Unknown
    name_unknown: Unknown
    ability_none: No Ability
    location_unknown: Unknown
    moves_none: None
    no_gender: Genderless
    gender_suffix: "% male"
    moves_label: "Moves: "
    strategy_header: "Strategy:"
    reporter_label: "Reporter: "
    name_separator: ": "
    list_separator: ", "
