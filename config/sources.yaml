# ============================================================
# 数据源注册表
# ------------------------------------------------------------
# 新增一个数据源：
#   1. 在 src/sources/ 下新建一个 .py，实现 fetch() -> FetchResult
#   2. 在下面照抄一段配置，填上 adapter 名
#   3. 完事。主流程不用改。
#
# 停用数据源：把 enabled 改成 false（或直接删掉这一段）
# 调整优先级：改 priority，数字越小越优先
# ============================================================

sources:
  # ---------------- Alphapedia（主通道，当前唯一在用的）----------------
  - name: 纪念蓝鼻子工具箱
    adapter: lanbizi
    enabled: false
    priority: 20
    options:
      target: https://pokemmo.lanbizi.com/api/alpha/spawn/current
      # 本源只给中文，没有英文字段，走中文名 + 别名表解析
      prefer_english_keys: false
      # 该源 monster_id 需要 /100 才得到全国图鉴号
      monster_id_divisor: 100
      extra_lines:
        hms: false

# ------------------------------------------------------------
# 关于不同源的差异：
#   - 语言不同：有的给中文，有的给英文，有的是机翻中文。
#     只要源提供英文字段，就用英文查 pokedex.json 拿官方译名，
#     机翻问题自动绕过；没有英文字段的源，走中文名 + 别名表。
#   - 字段不同：有的带秘传机，有的不带。
#     每个适配器自己决定把哪些字段渲染成 extra_lines，
#     主流程只负责把它们插到固定位置。
# ------------------------------------------------------------
  - name: LZPoke 报点
    adapter: lzpoke_reports
    enabled: true
    priority: 10
    options:
      target: https://tool.lzpoke.com/api/reports?type=alpha
      # 经阿里云隧道代理(本地 8899,由 autossh 开机自启维护)访问海外源站
      proxy: http://127.0.0.1:8899
      extra_lines:
        level: true
        vote: true

  - name: PokemmoTools Landing
    adapter: pokemmotools_landing
    enabled: true
    priority: 20
    options:
      target: https://alpha.pokemmotools.org/alpha-list
      proxy: http://127.0.0.1:8899
  