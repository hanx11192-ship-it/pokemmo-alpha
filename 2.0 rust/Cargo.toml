[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["pokemmo-alpha contributors"]

[workspace.dependencies]
# ---- 本地 crate ----
alpha-core = { path = "crates/alpha-core" }
alpha-strategy = { path = "crates/alpha-strategy" }
alpha-sources = { path = "crates/alpha-sources" }
alpha-notify = { path = "crates/alpha-notify" }
alpha-store = { path = "crates/alpha-store" }
alpha-plugin = { path = "crates/alpha-plugin" }
alpha-scheduler = { path = "crates/alpha-scheduler" }

# ---- 序列化 ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# ---- 异步 / 网络 ----
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "gzip",
    "brotli",
    "socks",
] }
futures = "0.3"
async-trait = "0.1"

# ---- Web ----
# multipart：面板的「上传插件 / 上传适配器」走 multipart/form-data
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }

# ---- 存储 ----
rusqlite = { version = "0.31", features = ["bundled"] }

# ---- 工具 ----
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
md-5 = "0.10"
regex = "1"
once_cell = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"

# ---- 插件沙箱 ----
# sync 特性让 Engine 可跨线程共享（面板的 axum State 需要）；
# serde 让 Dynamic 值与 JSON 互转，省掉手写映射代码。
rhai = { version = "1.26", features = ["sync", "serde"] }

# ---- 鉴权 ----
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
# 只为了校验 werkzeug 极早期版本的 `pbkdf2:sha1:<n>$...` 哈希。
# 现网 users 表里没有 sha1 的行，但用户的库可能从那个年代升上来，
# 少一个分支就会变成「密码明明对却登不进去」。
sha1 = "0.10"
base64 = "0.22"
# werkzeug 的历史密码哈希：现网 users 表里存的是 scrypt（werkzeug>=2.3 默认）
# 与 pbkdf2:sha256（更早版本默认），两种都要能校验，否则老用户登不进来。
scrypt = { version = "0.11", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
subtle = "2"
cookie = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# 开发构建也开优化：本机只有 2 核，engine 相关代码在 debug 下慢得离谱
[profile.dev]
opt-level = 2
debug = 1
