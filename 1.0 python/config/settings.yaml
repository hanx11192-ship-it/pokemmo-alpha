# ============================================================
# 全局设置
# ============================================================

# 所有时间计算使用的时区。不依赖 VPS 系统本地时区。
timezone: Asia/Shanghai

# 推送语言：zh（中文）/ en（英文）/ both（中英双语，先中后英）
language: zh

# ---------- 去重 ----------
dedup:
  # 记录已处理时段的标记文件。
  # 用「数据源给的时段唯一标识」去重，不再自己按小时算时段，避免跨天撞车和时区偏移。
  state_file: data/state.json

# ---------- 网络 ----------
http:
  # 单次请求超时（秒）。
  # 注意：不要设太大。源不可达时是「连不上」而不是「慢」，
  # 20 秒 × 3 次重试 = 一轮白等 60 秒，观感极差。默认压到 8 秒。
  timeout: 8
  # 连接阶段单独的超时（秒），比总超时更短，连不上就立刻放弃换下一个
  connect_timeout: 5
  # 请求失败重试：延迟秒数序列（依次执行，全部失败才放弃）
  # 只保留 1 次重试，避免源挂掉时反复空等
  retry_delays: [0, 0.5]
  verify_ssl: false          # 转发服务多为自签证书，关掉校验
  proxy: null                # 例如 http://127.0.0.1:7890；也可由 HTTPS_PROXY 环境变量提供

# ---------- 推送 ----------
notify:
  wxpusher:
    enabled: true
    # token 从环境变量读取，避免写进仓库
    app_token_env: WXPUSHER_APP_TOKEN_alpha
    topic_ids: [45385]
    # 摘要直接用数据源给的时段名（早头/午头/晚头/晨头）
    summary_from_slot_name: true
    # 摘要为空时的兜底
    fallback_summary: 头目

  # 推送失败时的行为：raise（抛异常，不写去重标记，下轮重试）
  on_failure: raise

# ---------- 并发 ----------
# 多个数据源「同时」请求，而不是按优先级排队。
# 好处：及时性（不用等慢源）+ 可靠性（一个源挂了还有别的）。
concurrency:
  # 整个并发轮询的总时限（秒）。所有源同时跑，这里控制「最晚多久必须交卷」。
  timeout: 15
  # 最大并发线程数（默认按启用的源数量）
  max_workers: 8

# ---------- 日志 ----------
logging:
  level: INFO
  file: logs/alpha.log
  # 单文件最大 2MB，保留 3 个
  max_bytes: 2097152
  backup_count: 3
